---
- name: Remediacion automatica Instana (Windows)
  hosts: all
  gather_facts: false
  tasks:
    - name: Mostrar datos recibidos de Instana
      ansible.builtin.debug:
        msg: "Alerta {{ severidad | default('n/a') }} en {{ target_host | default('n/a') }}"

    - name: Reiniciar servicio
      ansible.windows.win_service:
        name: "{{ servicio | default('Spooler') }}"
        state: restarted
